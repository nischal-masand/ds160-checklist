<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS-160 Document Checklist — B1/B2 Visa for Figma Config</title>
  <meta name="description" content="Complete category-wise checklist of all documents needed for US B1/B2 visa DS-160 application for Figma Config, company sponsored." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise-overlay"></div>

  <!-- Floating Progress Bar -->
  <div class="floating-progress" id="floating-progress">
    <div class="floating-progress-inner">
      <div class="floating-progress-info">
        <span class="chip-dot"></span>
        <span id="floating-progress-text" class="floating-progress-label">0 of 0 collected</span>
      </div>
      <div class="floating-progress-bar-track">
        <div class="floating-progress-bar-fill" id="floating-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header id="page-header">
    <div class="header-content">
      <div class="header-badge">
        <span class="badge-icon">🇺🇸</span>
        <span class="badge-text">B1/B2 VISA</span>
      </div>
      <h1 id="page-title">DS-160 Document Checklist</h1>
      <div class="header-meta">
        <div class="meta-chip">
          <span class="chip-dot"></span>
          <span id="progress-text">0 of 0 collected</span>
        </div>
        <div class="meta-chip">
          <span class="chip-icon">📋</span>
          <span id="category-count">0 categories</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Controls -->
  <div class="controls-bar" id="controls-bar">
    <button class="control-btn" id="btn-expand-all" title="Expand All">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      <span>Expand All</span>
    </button>
    <button class="control-btn" id="btn-collapse-all" title="Collapse All">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
      <span>Collapse All</span>
    </button>
    <button class="control-btn" id="btn-reset" title="Reset All">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      <span>Reset</span>
    </button>
    <div class="controls-spacer"></div>
    <button class="control-btn accent" id="btn-share" title="Copy shareable link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      <span>Share</span>
    </button>
    <button class="control-btn accent" id="btn-print" title="Print / Save as PDF">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      <span>Print</span>
    </button>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-text" id="toast-text">Copied to clipboard!</span>
  </div>

  <div style="max-width: var(--container-max); margin: 16px auto 24px; padding: 0 24px;" class="tip-wrapper">
    <div style="padding: 12px 16px; background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border-default); text-align: left; display: flex; align-items: flex-start; gap: 8px;">
      <span style="font-size: 14px;">💡</span>
      <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0;">
        <strong style="color: var(--text-primary); font-weight: 500;">Tip:</strong> Carry originals and photocopies of all documents. Keep digital copies on your phone as backup.
      </p>
    </div>
  </div>

  <!-- Main Content -->
  <main id="checklist-container"></main>

  <script src="app.js"></script>
</body>
</html>
